<header class="bg-slate-900 text-white">
  <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-4">
    <a routerLink="/" class="flex items-center gap-2 text-lg font-bold tracking-tight">
      <span class="inline-flex h-7 w-7 items-center justify-center rounded-lg bg-indigo-500 text-sm">N</span>
      NeoBank
    </a>

    @if (auth.isLoggedIn()) {
      <div class="flex items-center gap-3 text-sm">
        @if (auth.user(); as u) {
          <span class="hidden text-slate-300 sm:inline">{{ u.firstName }} {{ u.lastName }}</span>
        }
        <button type="button" class="btn-ghost" (click)="logout()">Log out</button>
      </div>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
