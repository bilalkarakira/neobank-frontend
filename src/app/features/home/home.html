<div class="mx-auto mt-10 w-full max-w-3xl px-4">
  @if (user(); as u) {
    <div class="card">
      <h1 class="text-2xl font-bold">Hello, {{ u.firstName }}</h1>
      <p class="mt-1 text-sm text-slate-500">Welcome to NeoBank. Accounts and transfers are coming soon.</p>

      <dl class="mt-6 grid grid-cols-1 gap-4 text-sm sm:grid-cols-3">
        <div>
          <dt class="text-slate-500">Name</dt>
          <dd class="font-medium">{{ u.firstName }} {{ u.lastName }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Email</dt>
          <dd class="font-medium">{{ u.email }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Role</dt>
          <dd class="font-medium">{{ u.role }}</dd>
        </div>
      </dl>
    </div>
  } @else {
    <p class="text-sm text-slate-500">Loading your profile…</p>
  }
</div>
