<div class="mx-auto mt-10 w-full max-w-3xl space-y-8 px-4 pb-16">
  @if (user(); as u) {
    <div>
      <h1 class="text-2xl font-bold">Hello, {{ u.firstName }}</h1>
      <p class="mt-1 text-sm text-slate-500">Here is an overview of your NeoBank accounts.</p>
    </div>

    <app-accounts />
  } @else {
    <p class="text-sm text-slate-500">Loading your profile…</p>
  }
</div>
