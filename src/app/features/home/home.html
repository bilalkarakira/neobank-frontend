<div class="mx-auto pt-8 sm:pt-12 w-full max-w-5xl space-y-8 px-4 sm:px-8 pb-16">
  @if (user(); as u) {
    <div>
      <h1 class="page-title">Hello, {{ u.firstName }} 👋</h1>
      <p class="mt-1 text-slate-500">Here is an overview of your NeoBank accounts.</p>
    </div>

    <app-accounts />
  } @else {
    <p class="text-sm text-slate-500">Loading your profile…</p>
  }
</div>
