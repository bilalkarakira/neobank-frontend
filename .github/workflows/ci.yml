# build:  installs the dependencies exactly as locked, runs every unit test once and makes the production build.
# docker: the Dockerfile (nginx with the production build; the demo stack of the backend repository uses it) still builds.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: The image builds
        run: docker build -t neobank-frontend .
